name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to publish, e.g. v0.5.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build-signed-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: reactivecircus/android-sdk-setup@v1
        with:
          cmdline-tools-version: "11076708"
          platforms: "android-36"
          build-tools: "36.0.0"
          cache: true
          licenses: "android-sdk-preview-license|android-sdk-license"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore from base64 secret
        env:
          KEYSTORE_BASE64: ${{ secrets.SHQ_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Missing secret SHQ_RELEASE_KEYSTORE_BASE64. Set the four SHQ_RELEASE_* secrets in repository settings before pushing tags." >&2
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/release.keystore
          shasum -a 256 keystore/release.keystore

      - name: Assemble signed release APK
        env:
          SHENGQIAO_STORE_PASSWORD: ${{ secrets.SHQ_RELEASE_STORE_PASSWORD }}
          SHENGQIAO_KEY_ALIAS: ${{ secrets.SHQ_RELEASE_KEY_ALIAS }}
          SHENGQIAO_KEY_PASSWORD: ${{ secrets.SHQ_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          echo "APK SHA-256: $(shasum -a 256 "$APK" | awk '{print $1}')"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  publish:
    name: publish-github-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: app-release-aab
          path: dist

      - name: Compute APK metadata
        id: meta
        run: |
          APK="dist/app-release.apk"
          echo "version=$(./gradlew -q :app:printVersionName)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/app-release.apk
            dist/app-release.aab
          fail_on_unmatched_files: true
